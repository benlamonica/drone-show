# OpenOCD configuration for a Pico 2 W (RP2350) debugged through a second Pico
# running the Raspberry Pi debugprobe firmware (CMSIS-DAP).
#
# Requires the Raspberry Pi OpenOCD fork: upstream 0.12.0 has no RP2350 target.
#   openocd -f pico/openocd/rp2350-picoprobe.cfg
source [find interface/cmsis-dap.cfg]
adapter speed 5000
source [find target/rp2350.cfg]
